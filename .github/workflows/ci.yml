name: CI

# Validates the marketplace and the plugin with the Claude Code version in package.json (scripts/check.sh). The job
# name is the required check in .bulldozer.yml: renaming it means changing it there. This repo is public, so CI runs on
# GitHub's runners, never on our self-hosted ones. Actions are pinned to commit SHAs on purpose.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: scripts/check.sh
        env:
          BASE_REF: ${{ github.base_ref }}
